repo_name: Ctrl Alt Del
repo_url: https://github.com/danilofns/teste

site_name: Ctrl Alt Del
site_url: https://github.com/danilofns/teste

docs_dir: docs

theme:
  name: material
  language: pt-BR

  palette:
    # Modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Mudar para o modo escuro

    # Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Mudar para o modo claro

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/style.css

nav:
  - Home: index.md

  - Canvas:
      - Canvas: Canvas/canvas.md
      - Guiding Questions: Canvas/guiding-questions.md

  - Projeto:
      - Dados: projeto/dados.md
      - Modelo: projeto/modelo.md

  - Arquitetura: projeto/arquitetura.md
  
  - Participantes:
      - Participantes: equipe.md